name: Download bundles
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - name: Zip (Mac and Linux)
        if: runner.os != 'Windows'
        working-directory: release
        run: zip -qr write-better-${{ matrix.platform }}.zip write-better-${{ matrix.platform }}
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/write-better-${{ matrix.platform }} -DestinationPath release/write-better-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: write-better-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish tested bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt --verify-tag --title "write_better. $RELEASE_TAG" --notes-file ../RELEASE.md
